description: |
  Intel/Marvell PXA2xx interrupt controller.

  PXA25x/26x expose a single 32-entry bank; PXA27x adds a second bank for
  interrupt sources 32 and up.

compatible: "intel,pxa2xx-intc"

include: [interrupt-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  "#interrupt-cells":
    const: 2

  num-irqs:
    type: int
    required: true
    description: Number of interrupt sources implemented by this controller.

interrupt-cells:
  - irq
  - priority

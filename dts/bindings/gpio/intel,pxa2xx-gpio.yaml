description: |
  One 32-line bank of the Intel/Marvell PXA2xx GPIO controller.

  reg is the bank's GPLR. The bank's GPDR, GPSR and GPCR sit 0x0c, 0x18 and
  0x24 above it, in all four banks of a PXA27x (GPLR0-2 at 0x00-0x08, GPLR3
  at 0x100), so one node per bank needs nothing else.

  Configuring a line through this driver also routes it to plain GPIO
  (alternate function 0).

compatible: "intel,pxa2xx-gpio"

include: [gpio-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  ngpios:
    required: true

  "#gpio-cells":
    const: 2

gpio-cells:
  - pin
  - flags
